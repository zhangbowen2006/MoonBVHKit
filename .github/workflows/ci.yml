name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  moonbit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show MoonBit Version
        run: moon version --all

      - name: Check All Targets
        run: moon check --deny-warn --target all

      - name: Build
        run: moon build

      - name: Test All Targets
        run: moon test --deny-warn --target all

      - name: Check Formatting
        run: |
          for attempt in 1 2 3; do
            if moon fmt --check; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 10))
              echo "moon fmt failed (attempt $attempt); retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          exit 1

      - name: Check Public API Snapshot
        run: |
          moon info
          git diff --exit-code -- '*.mbti'

      - name: Run CLI
        run: moon run cmd/main

      - name: Run CLI JSON
        run: moon run cmd/main -- --json

      - name: Run CLI CSV
        run: moon run cmd/main -- --csv

      - name: Run CLI Quality
        run: moon run cmd/main -- --quality --json

      - name: Run CLI Profiles
        run: moon run cmd/main -- --profiles --csv

      - name: Run CLI Bounds
        run: moon run cmd/main -- --bounds --json

      - name: Run CLI Resampling
        run: moon run cmd/main -- --resample 12

      - name: Run CLI Batch Gate
        run: moon run cmd/main -- --batch --profile strict-ci --csv

      - name: Run CLI JUnit
        run: moon run cmd/main -- --junit

      - name: Run Basic Example
        run: moon run examples/basic
